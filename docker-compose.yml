
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    ports:
      - "14331:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${SA_PASSWORD}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  oltp:
    build:
      context: ./OLTPApp
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OLTPAppDb;User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  # One-shot: builds OlapDW from olap/sql, then exits. Skips the DDL and seed when OlapDW.dbo.FactVisit
  # already exists, because the DDL scripts drop and recreate the tables. olap/sql/seed may be empty (#69).
  olap-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SQLCMDPASSWORD: ${SA_PASSWORD}
    volumes:
      - ./olap/sql:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        shopt -s nullglob
        sqlcmd() { /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b "$$@"; }
        built=$$(sqlcmd -h -1 -W -Q "SET NOCOUNT ON; SELECT CASE WHEN OBJECT_ID(N'OlapDW.dbo.FactVisit') IS NULL THEN 0 ELSE 1 END")
        if [ "$$built" = "1" ]; then
          echo "OlapDW already built, skipping DDL and seed"
        else
          for f in /sql/ddl/*.sql; do echo "Running $$f"; sqlcmd -i "$$f"; done
          for f in /sql/seed/*.sql; do echo "Running $$f"; sqlcmd -i "$$f"; done
        fi
        for f in /sql/procs/*.sql; do echo "Running $$f"; sqlcmd -i "$$f"; done

        for f in /sql/etl/*.sql; do echo "Running $$f"; sqlcmd -i "$$f"; done
    depends_on:
      sqlserver:
        condition: service_healthy

  olap-api:
    build:
      context: ./olap/OlapApi
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Driver={ODBC Driver 18 for SQL Server};Server=sqlserver,1433;Database=${SQL_DATABASE};Uid=sa;Pwd=${SA_PASSWORD};TrustServerCertificate=yes;"
    ports:
      - "8081:8080"
    depends_on:
      olap-db-init:
        condition: service_completed_successfully

  olap-client:
    build:
      context: ./olap/olap-client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8081
    ports:
      - "3000:80"
    depends_on:
      - olap-api

volumes:
  sqlserver_data:
