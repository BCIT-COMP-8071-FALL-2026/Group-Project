name: Require Team Approvals

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Re-run when a review is submitted/dismissed so the checks update
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

# One run per PR at a time; a newer event cancels the older in-progress run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa-approval:
    name: QA team approval
    runs-on: ubuntu-latest
    steps:
      - name: Require QA team approval
        uses: op5dev/require-team-approval@v1
        with:
          team: qa # replace with your QA team slug
          token: ${{ secrets.CI_PAT }}

  devops-approval:
    name: DevOps team approval (main only)
    # github.base_ref is empty on pull_request_review events, so use the event payload
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require DevOps team approval
        uses: op5dev/require-team-approval@v1
        with:
          team: devops # replace with your DevOps team slug
          token: ${{ secrets.CI_PAT }}

  no-blocking-reviews:
    name: No outstanding change requests
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CI_PAT }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Fail if any reviewer's latest review requests changes
        run: |
          # Latest meaningful review per user (comments don't change status)
          reviews=$(gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" --paginate | jq -s 'add // []')
          requesters=$(jq -r '
            map(select(.state=="APPROVED" or .state=="CHANGES_REQUESTED" or .state=="DISMISSED"))
            | sort_by(.submitted_at)
            | group_by(.user.login)
            | map(last)
            | map(select(.state=="CHANGES_REQUESTED") | .user.login)
            | .[]' <<< "$reviews")

          if [[ -n "$requesters" ]]; then
            for user in $requesters; do
              echo "::error::$user has requested changes on this PR."
            done
            exit 1
          fi
          echo "No outstanding change requests."
