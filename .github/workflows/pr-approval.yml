name: Require Team Approvals

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Re-run when a review is submitted/dismissed so the check updates
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  gh-test:
    name: Debug team lookup
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CI_PAT }}
    steps:
     - run: |
        gh api user --jq .login
        gh api orgs/${{ github.repository_owner }}/teams --jq '.[].slug'

  qa-approval:
    name: QA team approval
    runs-on: ubuntu-latest
    steps:
      - name: Require QA team approval
        uses: op5dev/require-team-approval@v1
        with:
          team: qa
          token: ${{ secrets.CI_PAT }} # PAT with read:org scope

  devops-approval:
    name: DevOps team approval (main only)
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require DevOps team approval
        uses: op5dev/require-team-approval@v1
        with:
          team: devops
          token: ${{ secrets.CI_PAT }} # PAT with read:org scope
