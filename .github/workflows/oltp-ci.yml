name: OLTP CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore GroupProject.sln
      - run: dotnet build GroupProject.sln --no-restore -c Release
      - name: Placeholder test (no test project yet)
        run: echo "dotnet test will run once a test project is added"
